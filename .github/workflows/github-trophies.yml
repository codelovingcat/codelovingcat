name: Update GitHub Trophies

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/github-trophies.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate pastel trophy SVG
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: codelovingcat
          output_path: assets/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: chalk

      - name: Commit updated trophy image
        run: |
          if [[ -n "$(git status --porcelain assets/github-trophies.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/github-trophies.svg
            git commit -m "Update GitHub trophies"
            git push
          fi
