name: Update GitHub Profile Summary Cards

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-summary-cards.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate pastel profile summary cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: codelovingcat
          BRANCH_NAME: main
          UTC_OFFSET: 3
          EXCLUDE: ""
          AUTO_PUSH: true
          THEME: "nord_dark"
          ANIMATION: ""
          DURATION: ""
          NAME: "Ürem"
